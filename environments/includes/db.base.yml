services:
  php-fpm:
    depends_on:
      - db

  db:
    hostname: "${ROLL_ENV_NAME}-db"
    image: ${ROLL_IMAGE_REPOSITORY}/${DB_DISTRIBUTION:-mariadb}:${DB_DISTRIBUTION_VERSION:-10.4}
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-app}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-app}
      - MYSQL_USER=${MYSQL_USER:-app}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-app}
      - MYSQL_HISTFILE=/sql_history/.sql_history
    volumes:
      - dbdata:/var/lib/mysql
      - sqlhistory:/sql_history
    healthcheck:
      ## MariaDB 11 ships only mariadb-admin and MySQL only mysqladmin. ping answers without
      ## credentials, so none are passed and none end up in argv.
      test: ["CMD-SHELL", "mariadb-admin ping --silent 2>/dev/null || mysqladmin ping --silent 2>/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  dbdata:
  sqlhistory:
